<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

.gallery img {
  width: 100%;
  max-width: 300px;
  height: auto;
  cursor: pointer;
  border-radius: 8px;
}

.lightbox {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.9);
  text-align: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 80%;
  margin-top: 60px;
}

.close {
  position: absolute;
  top: 20px;
  right: 25px;
  color: white;
  font-size: 40px;
  cursor: pointer;
}

.prev, .next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: 40px;
  cursor: pointer;
  padding: 10px;
}

.prev { left: 10px; }
.next { right: 10px; }
</style>
</head>

<body>

<h2>画像クリックで拡大</h2>

<div class="gallery">
  <img src="https://drive.google.com/uc?id=1cquzLpUZBwfiLLQ8MEZa7Y3xcRCVejzd" onclick="openLightbox(0)">
  <img src="https://drive.google.com/uc?id=1Ao9_Ov2hEuCiKONSxXAvCgze9PdqG_0T" onclick="openLightbox(1)">
  <img src="https://drive.google.com/uc?id=1tgv3YguuWWtp6HpYDGgTpwWdtoR2YewJ" onclick="openLightbox(2)">
</div>

<div id="lightbox" class="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>

  <span class="prev" onclick="changeSlide(-1)">❮</span>
  <span class="next" onclick="changeSlide(1)">❯</span>

  <img id="lightbox-img">
  <p id="caption" style="color:white;"></p>
</div>

<script>
const images = [
  { src: "https://drive.google.com/uc?id=1cquzLpUZBwfiLLQ8MEZa7Y3xcRCVejzd", title: "タイトル①" },
  { src: "https://drive.google.com/uc?id=1Ao9_Ov2hEuCiKONSxXAvCgze9PdqG_0T", title: "タイトル②" },
  { src: "https://drive.google.com/uc?id=1tgv3YguuWWtp6HpYDGgTpwWdtoR2YewJ", title: "タイトル③" }
];

let currentIndex = 0;

function openLightbox(index) {
  currentIndex = index;
  document.getElementById("lightbox").style.display = "block";
  showImage();
}

function showImage() {
  document.getElementById("lightbox-img").src = images[currentIndex].src;
  document.getElementById("caption").innerText = images[currentIndex].title;
}

function changeSlide(direction) {
  currentIndex += direction;
  if (currentIndex < 0) currentIndex = images.length - 1;
  if (currentIndex >= images.length) currentIndex = 0;
  showImage();
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

/* スワイプ */
let startX = 0;
const lightbox = document.getElementById("lightbox");

lightbox.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend", e => {
  let diff = e.changedTouches[0].clientX - startX;
  if (diff > 50) changeSlide(-1);
  if (diff < -50) changeSlide(1);
});
</script>

</body>
</html>
