<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* PC 4列 */
  gap: 10px;
}

.gallery img {
  width: 100%;
  height: auto;
  display: block;
}

.caption {
  text-align: center;
  font-size: 14px;
}

/* タブレット */
@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr); /* 2列 */
  }
}

/* スマホ */
@media (max-width: 600px) {
  .gallery {
    grid-template-columns: repeat(1, 1fr); /* 1列 */
  }
}
</style>

<div class="gallery">
  <div>
    <img src="https://raw.githubusercontent.com/andotama24/gazo/main/拝殿正面.JPG">
    <div class="caption">拝殿正面</div>
  </div>

  <div>
    <img src="https://raw.githubusercontent.com/andotama24/gazo/main/鳥居.JPG">
    <div class="caption">鳥居</div>
  </div>

  <div>
    <img src="https://raw.githubusercontent.com/andotama24/gazo/main/手水舎.JPG">
    <div class="caption">手水舎</div>
  </div>
</div>
