<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>神社ギャラリー</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:sans-serif;
    background:#f5f5f5;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.gallery img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.gallery img:hover{
    transform:scale(1.03);
}

/* タブレット */
@media(max-width:900px){
    .gallery{
        grid-template-columns:repeat(2,1fr);
    }
}

/* スマホ */
@media(max-width:600px){
    .gallery{
        grid-template-columns:1fr;
    }
}

/* ライトボックス */

.lightbox{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.lightbox img{
    max-width:95%;
    max-height:80%;
    border-radius:10px;
}

.close{
    color:white;
    font-size:20px;
    margin-top:20px;
    cursor:pointer;
    background:#333;
    padding:10px 20px;
    border-radius:8px;
}

</style>
</head>

<body>

<h1>神社ギャラリー</h1>

<div class="gallery">

<img src="https://raw.githubusercontent.com/andotama24/gazo/main/haiden.jpg" alt="拝殿">

<img src="https://raw.githubusercontent.com/andotama24/gazo/main/torii.jpg" alt="鳥居">

<img src="https://raw.githubusercontent.com/andotama24/gazo/main/uramon.jpg" alt="裏門">

<img src="https://raw.githubusercontent.com/andotama24/gazo/main/temizusya.jpg" alt="手水舎">

</div>

<div class="lightbox" id="lightbox">
    <img id="lightbox-img">
    <div class="close" onclick="closeLightbox()">閉じる</div>
</div>

<script>

const images = document.querySelectorAll('.gallery img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

images.forEach(img => {
    img.addEventListener('click', () => {
        lightbox.style.display = 'flex';
        lightboxImg.src = img.src;
    });
});

function closeLightbox(){
    lightbox.style.display = 'none';
}

lightbox.addEventListener('click', function(e){
    if(e.target === lightbox){
        closeLightbox();
    }
});

</script>

</body>
</html>
