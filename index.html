<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ギャラリー</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
}

/* ギャラリー */
.gallery {
  display: flex;
  flex-direction: column;
}

.gallery img {
  width: 100%;
  height: auto;
  cursor: pointer;
}

/* ライトボックス */
.lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  justify-content: center;
  align-items: center;
}

/* 拡大画像（1枚＝画面いっぱい） */
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

/* ボタン（画像の中に表示） */
.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  color: white;
  cursor: pointer;
  padding: 10px;
  user-select: none;
}

.prev { left: 10px; }
.next { right: 10px; }

/* 閉じる */
.close {
  position: absolute;
  top: 10px;
  right: 20px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="gallery">
  <img src="https://raw.githubusercontent.com/andotama24/gazo/main/拝殿正面.JPG">
  <img src="https://raw.githubusercontent.com/andotama24/gazo/main/鳥居.JPG>
  <img src="https://raw.githubusercontent.com/andotama24/gazo/main/手水舎.JPG">
</div>

<!-- ライトボックス -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeBox()">×</span>
  <span class="nav prev" onclick="change(-1)">＜</span>
  <img id="lightbox-img">
  <span class="nav next" onclick="change(1)">＞</span>
</div>

<script>
const images = document.querySelectorAll('.gallery img');
const lightbox = document.getElementById('lightbox');
const lightImg = document.getElementById('lightbox-img');

let current = 0;

// クリックで拡大
images.forEach((img, index) => {
  img.onclick = () => {
    current = index;
    show();
    lightbox.style.display = "flex";
  };
});

// 表示
function show() {
  lightImg.src = images[current].src;
}

// 閉じる
function closeBox() {
  lightbox.style.display = "none";
}

// 次へ・前へ
function change(step) {
  current += step;
  if (current < 0) current = images.length - 1;
  if (current >= images.length) current = 0;
  show();
}
</script>

</body>
</html>
