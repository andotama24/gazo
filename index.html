<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  padding: 10px;
  font-family: sans-serif;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.gallery img {
  width: 100%;
  height: auto;
  display: block;
}

.caption {
  text-align: center;
  font-size: 14px;
}

/* タブレット */
@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* スマホ */
@media (max-width: 600px) {
  .gallery {
    grid-template-columns: repeat(1, 1fr);
  }
}
</style>
</head>

<body>

<div class="gallery">
  <div>
    <img src="https://raw.githubusercontent.com/andotama24/gazo/main/haiden.jpg">
    <div class="caption">唐破風屋根</div>
  </div>

  <div>
    <img src="https://raw.githubusercontent.com/andotama24/gazo/main/torii.jpg">
    <div class="caption">鳥居</div>
  </div>

  <div>
    <img src="https://raw.githubusercontent.com/andotama24/gazo/main/temizusya (1).jpg">          <div class="caption">手水舎</div>
    <div class="caption">手水舎</div>
  </div>

  <!-- 4列にするなら4枚必要 -->
  <div>
    <img src="https://raw.githubusercontent.com/andotama24/gazo/main/uramon.jpg">
    <div class="caption">裏門</div>
  </div>

</div>

</body>
</html>
