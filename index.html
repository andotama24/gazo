<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>画像ギャラリー</title>

<style>
body {
  margin: 0;  /*余白削除*/
  font-family: sans-serif;
  text-align: center;
}

/* 説明文 */
.note{
  font-size: 12px;
  color: #666;
  margin-top: 0px;
  margin-bottom: 10px;
}

/* ギャラリー */
.gallery {
  margin-top: 0;  /* 上の余白を詰める */
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  justify-content: center;
}

.item {
  width: 200px;
}

.item img {
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
}

.caption {
  margin-top: 5px;
  font-size: 14px;
}

/* ライトボックス（←ここ修正） */
.lightbox {
  display: none;   /* ←これを維持（重要） */
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
}

/* 中身を中央配置 */
.lightbox.active {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* 画像 */
.lightbox img {
  max-width: 90%;
  max-height: 90%;   /* ←少し大きくして改善 */
}

/* タイトル */
.lightbox-title {
  color: white;
  font-size: 18px;
  margin-top: 8px;
  background: rgba(0,0,0,0.4);
  padding: 6px 10px;
  border-radius: 6px;
}

/* キャプション */
.lightbox-caption {
  color: white;
  font-size: 14px;
  margin-top: 6px;
  background: rgba(0,0,0,0.4);
  padding: 8px 12px;
  border-radius: 6px;
  max-width: 90%;
}

/* ボタン */
.close, .prev, .next {
  position: absolute;
  color: white;
  font-size: 36px;
  cursor: pointer;
  user-select: none;
}

.close { top: 15px; right: 20px; }
.prev { top: 50%; left: 10px; transform: translateY(-50%); }
.next { top: 50%; right: 10px; transform: translateY(-50%); }

/* スマホ最適化（重要） */
@media (max-width: 600px) {

  .lightbox img {
    max-height: 100%;   /* ←画像を優先表示 */
  }

  .lightbox-title {
    font-size: 14px;
    padding: 5px 8px;
  }

  .lightbox-caption {
    font-size: 12px;
    padding: 6px 10px;
  }
}
</style>
</head>

<body>

<p class="note">画像クリックで拡大</p>

<div class="gallery" id="gallery"></div>

<div id="lightbox" class="lightbox">
  <span class="close" onclick="closeLightbox()">×</span>
  <span class="prev" onclick="changeSlide(-1)">❮</span>
  <span class="next" onclick="changeSlide(1)">❯</span>

  <img id="lightbox-img">
  <div id="lightbox-title" class="lightbox-title"></div>
  <div id="lightbox-caption" class="lightbox-caption"></div>
</div>

<script>
const images = [
  {
    src: "https://andotama24.github.io/gazo/拝殿正面.JPG",
    title: "拝殿正面",
    caption: "向拝には陣笠の形をした唐破風屋根がかかっている。"
  },
  {
    src: "https://andotama24.github.io/gazo/鳥居.JPG",
    title: "鳥居",
    caption: "神社の入口を示す重要な建造物。"
  },
  {
    src: "https://andotama24.github.io/gazo/手水舎.JPG",
    title: "手水舎",
    caption: "参拝前に手と口を清める場所。"
  }
];

const gallery = document.getElementById("gallery");

images.forEach((img, index) => {
  const item = document.createElement("div");
  item.className = "item";

  item.innerHTML = `
    <img src="${img.src}" onclick="openLightbox(${index})">
    <div class="caption">${img.title}</div>
  `;

  gallery.appendChild(item);
});

let currentIndex = 0;

function openLightbox(i) {
  currentIndex = i;
  const lb = document.getElementById("lightbox");
  lb.classList.add("active");   // ←ここ変更
  showImage();
}

function showImage() {
  document.getElementById("lightbox-img").src = images[currentIndex].src;
  document.getElementById("lightbox-title").innerText = images[currentIndex].title;
  document.getElementById("lightbox-caption").innerText = images[currentIndex].caption;
}

function changeSlide(n) {
  currentIndex += n;
  if (currentIndex < 0) currentIndex = images.length - 1;
  if (currentIndex >= images.length) currentIndex = 0;
  showImage();
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active"); // ←ここ変更
}

/* スワイプ */
let startX = 0;
const lightbox = document.getElementById("lightbox");

lightbox.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend", e => {
  let diff = e.changedTouches[0].clientX - startX;
  if (diff > 50) changeSlide(-1);
  if (diff < -50) changeSlide(1);
});
</script>

</body>
</html>
