<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>神社ギャラリー</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
}

/* ページタイトル */
.title {
  text-align: center;
  font-size: 18px;
  padding: 10px;
}

/* 縦並び */
.gallery {
  display: flex;
  flex-direction: column;
}

/* 各ブロック */
.item {
  margin-bottom: 10px;
}

.item img {
  width: 100%;
  height: auto;
  display: block;
  cursor: pointer;
}

/* 画像タイトル */
.caption {
  text-align: center;
  font-size: 14px;
  padding: 5px;
}

/* ライトボックス */
.lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.lightbox img {
  max-width: 95%;
  max-height: 70%;
  object-fit: contain;
}

/* 拡大時キャプション */
.description {
  color: white;
  padding: 10px;
  text-align: center;
}

/* ボタン */
.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  color: white;
  cursor: pointer;
}

.prev { left: 10px; }
.next { right: 10px; }

.close {
  position: absolute;
  top: 10px;
  right: 20px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="title">神社ギャラリー</div>

<div class="gallery">

  <div class="item">
    <img src="https://raw.githubusercontent.com/andotama24/gazo/main/拝殿正面.JPG" onclick="openBox(0)">
    <div class="caption">拝殿 正面</div>
  </div>

  <div class="item">
    <img src="https://raw.githubusercontent.com/andotama24/gazo/main/鳥居.JPG" onclick="openBox(1)">
    <div class="caption">鳥居</div>
  </div>

  <div class="item">
    <img src="https://raw.githubusercontent.com/andotama24/gazo/main/手水舎.JPG" onclick="openBox(2)">
    <div class="caption">手水舎</div>
  </div>

</div>

<!-- ライトボックス -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeBox()">×</span>
  <span class="nav prev" onclick="change(-1)">＜</span>

  <img id="lightbox-img">
  <div class="description" id="desc"></div>

  <span class="nav next" onclick="change(1)">＞</span>
</div>

<script>
const images = [
  {
    src: "https://raw.githubusercontent.com/andotama24/gazo/main/拝殿正面.JPG",
    desc: "拝殿の正面の様子です"
  },
  {
    src: "https://raw.githubusercontent.com/andotama24/gazo/main/鳥居.JPG",
    desc: "入口に立つ鳥居です"
  },
  {
    src: "https://raw.githubusercontent.com/andotama24/gazo/main/手水舎.JPG",
    desc: "手を清める手水舎です"
  }
];

let current = 0;

function openBox(index) {
  current = index;
  show();
  document.getElementById("lightbox").style.display = "flex";
}

function show() {
  document.getElementById("lightbox-img").src = images[current].src;
  document.getElementById("desc").innerText = images[current].desc;
}

function closeBox() {
  document.getElementById("lightbox").style.display = "none";
}

function change(step) {
  current += step;
  if (current < 0) current = images.length - 1;
  if (current >= images.length) current = 0;
  show();
}
</script>

</body>
</html>
