<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  margin:0;
  padding:10px;
  font-family:sans-serif;
  background:#f5f5f5;
}

/* ギャラリー */

.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

/* タブレット */
@media screen and (max-width:900px){
  .gallery{
    grid-template-columns:repeat(2,1fr);
  }
}

/* スマホ */
@media screen and (max-width:600px){
  .gallery{
    grid-template-columns:1fr;
  }
}

.item{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

.item img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.title{
  padding:10px;
  text-align:center;
  font-size:14px;
}

/* ライトボックス */

.lightbox{
  display:none;
  position:fixed;
  z-index:9999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
}

.lightbox-content{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.lightbox img{
  max-width:92%;
  max-height:75%;
  border-radius:10px;
}

.caption{
  color:white;
  margin-top:15px;
  font-size:18px;
  text-align:center;
}

.close{
  position:absolute;
  top:20px;
  right:25px;
  color:white;
  font-size:30px;
  cursor:pointer;
}

.prev,
.next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  color:white;
  font-size:45px;
  cursor:pointer;
  user-select:none;
  padding:15px;
}

.prev{
  left:10px;
}

.next{
  right:10px;
}

</style>
</head>

<body>

<div class="gallery">

<div class="item">
<img src="https://raw.githubusercontent.com/andotama24/gazo/main/haiden.jpg"
onclick="openLightbox(0)">
<div class="title">拝殿正面</div>
</div>

<div class="item">
<img src="https://raw.githubusercontent.com/andotama24/gazo/main/torii.jpg"
onclick="openLightbox(1)">
<div class="title">鳥居</div>
</div>

<div class="item">
<img src="https://raw.githubusercontent.com/andotama24/gazo/main/uramon.jpg"
onclick="openLightbox(2)">
<div class="title">裏門</div>
</div>

<div class="item">
<img src="https://raw.githubusercontent.com/andotama24/gazo/main/temizusya.jpg"
onclick="openLightbox(3)">
<div class="title">手水舎</div>
</div>

</div>
