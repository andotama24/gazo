<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神社ギャラリー</title>

<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 10px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.gallery img {
  width: 100%;
  height: auto;
  display: block;
}

.caption {
  text-align: center;
  font-size: 14px;
}

/* タブレット */
@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* スマホ */
@media (max-width: 600px) {
  .gallery {
    grid-template-columns: repeat(1, 1fr);
  }
}
</style>
</head>

<body>

<h2 style="text-align:center;">神社ギャラリー</h2>

<div class="gallery">
  <div>
    <img src="画像URL1">
    <div class="caption">拝殿正面</div>
  </div>

  <div>
    <img src="画像URL2">
    <div class="caption">鳥居</div>
  </div>

  <div>
    <img src="画像URL3">
    <div class="caption">手水舎</div>
  </div>

  <div>
    <img src="画像URL4">
    <div class="caption">境内</div>
  </div>
</div>

</body>
</html>
