<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>画像ギャラリー</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
.note{
  font-size: 12px;
  color: #666;
  margin-top: 5px;   /*上の余白を小さく */
  margin-bottom: 15px;  /*下の余白も調整 */
}

/* ギャラリー */
.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  justify-content: center;
}

.item {
  width: 200px;
}

.item img {
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
}

.caption {
  margin-top: 5px;
  font-size: 14px;
}

/* ライトボックス */
.lightbox {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  text-align: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 75%;
  margin-top: 40px;
}

/* キャプション（拡大時） */
.lightbox-caption {
  color: white;
  margin-top: 10px;
  font-size: 18px;
}

/* ボタン */
.close, .prev, .next {
  position: absolute;
  color: white;
  font-size: 40px;
  cursor: pointer;
}

.close { top: 20px; right: 30px; }
.prev { top: 50%; left: 10px; transform: translateY(-50%); }
.next { top: 50%; right: 10px; transform: translateY(-50%); }
</style>
</head>

<body>

<p class="noye">画像クリックで拡大</p>

<div class="gallery" id="gallery"></div>

<div id="lightbox" class="lightbox">
  <span class="close" onclick="closeLightbox()">×</span>
  <span class="prev" onclick="changeSlide(-1)">❮</span>
  <span class="next" onclick="changeSlide(1)">❯</span>

  <img id="lightbox-img">
  <div id="lightbox-caption" class="lightbox-caption"></div>
</div>

<script>
/* ===== ここに画像を追加するだけ ===== */
const images = [
  {
  src: "https://andotama24.github.io/gazo/拝殿正面.JPG",
  title: "拝殿正面",
  caption: "向拝には陣笠の形をした唐破風屋根がかかっている。"
  },
  {
  src: "https://andotama24.github.io/gazo/鳥居.JPG",
    title: "タイトル②",
    caption: "説明②"
  },
  {
  src: "https://andotama24.github.io/gazo/手水舎.JPG",
    title: "タイトル③",
    caption: "説明③"
  }

  /* ←ここに同じ形式でどんどん追加（25枚OK） */
];

/* ===== ギャラリー自動生成 ===== */
const gallery = document.getElementById("gallery");

images.forEach((img, index) => {
  const item = document.createElement("div");
  item.className = "item";

  item.innerHTML = `
    <img src="${img.src}" onclick="openLightbox(${index})">
    <div class="caption">${img.title}</div>
  `;

  gallery.appendChild(item);
});

/* ===== ライトボックス ===== */
let currentIndex = 0;

function openLightbox(i) {
  currentIndex = i;
  document.getElementById("lightbox").style.display = "block";
  showImage();
}

function showImage() {
  document.getElementById("lightbox-img").src = images[currentIndex].src;
  document.getElementById("lightbox-caption").innerText = images[currentIndex].caption;
}

function changeSlide(n) {
  currentIndex += n;
  if (currentIndex < 0) currentIndex = images.length - 1;
  if (currentIndex >= images.length) currentIndex = 0;
  showImage();
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

/* スワイプ対応 */
let startX = 0;
const lightbox = document.getElementById("lightbox");

lightbox.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend", e => {
  let diff = e.changedTouches[0].clientX - startX;
  if (diff > 50) changeSlide(-1);
  if (diff < -50) changeSlide(1);
});
</script>

</body>
</html>
