<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  margin:0;
  padding:10px;
  font-family:sans-serif;
  background:#f5f5f5;
}

/* ギャラリー */

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.item{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

.item img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.title{
  padding:10px;
  text-align:center;
  font-size:14px;
}

/* ライトボックス */

.lightbox{
  display:none;
  position:fixed;
  z-index:9999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
}

.lightbox-content{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.lightbox img{
  max-width:92%;
  max-height:75%;
  border-radius:10px;
}

.caption{
  color:white;
  margin-top:15px;
  font-size:18px;
  text-align:center;
}

.close{
  position:absolute;
  top:40px;
  right:40px;
  background:rgba(0,0,0,0.6);
  padding:8px 14px;
  border-radius:8px;
}

.prev,
.next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  color:white;
  font-size:45px;
  cursor:pointer;
  user-select:none;
  padding:15px;
}

.prev{
  left:10px;
}

.next{
  right:10px;
}

</style>
</head>

<body>

<div class="gallery">

<div class="item">
<img src="https://raw.githubusercontent.com/andotama24/gazo/main/haiden.jpg"
onclick="openLightbox(0)">
<div class="title">拝殿正面</div>
</div>

<div class="item">
<img src="https://raw.githubusercontent.com/andotama24/gazo/main/torii.jpg"
onclick="openLightbox(1)">
<div class="title">鳥居</div>
</div>

<div class="item">
<img src="https://raw.githubusercontent.com/andotama24/gazo/main/uramon.jpg"
onclick="openLightbox(2)">
<div class="title">裏門</div>
</div>

<div class="item">
<img src="https://raw.githubusercontent.com/andotama24/gazo/main/temizusya.jpg"
onclick="openLightbox(3)">
<div class="title">手水舎</div>
</div>

</div>

<!-- ライトボックス -->

<div class="lightbox" id="lightbox">

<div class="lightbox-content">

<div class="close" onclick="closeLightbox()">閉じる</div>

<div class="prev" onclick="changeSlide(-1)">❮</div>

<img id="lightbox-img">

<div class="next" onclick="changeSlide(1)">❯</div>

<div class="caption" id="caption"></div>

</div>
</div>

<script>

const images = [
{
src:"https://raw.githubusercontent.com/andotama24/gazo/main/haiden.jpg",
caption:"陣笠の形をした唐破風屋根"
},
{
src:"https://raw.githubusercontent.com/andotama24/gazo/main/torii.jpg",
caption:"神社入口の鳥居"
},
{
src:"https://raw.githubusercontent.com/andotama24/gazo/main/uramon.jpg",
caption:"裏門の景観"
},
{
src:"https://raw.githubusercontent.com/andotama24/gazo/main/temizusya.jpg",
caption:"手を洗い身を清める所"
}
];

let currentIndex = 0;

function openLightbox(index){

currentIndex = index;

document.getElementById("lightbox").style.display = "block";

document.getElementById("lightbox-img").src =
images[index].src;

document.getElementById("caption").innerText =
images[index].caption;
}

function closeLightbox(){
document.getElementById("lightbox").style.display = "none";
}

function changeSlide(step){

currentIndex += step;

if(currentIndex < 0){
currentIndex = images.length - 1;
}

if(currentIndex >= images.length){
currentIndex = 0;
}

document.getElementById("lightbox-img").src =
images[currentIndex].src;

document.getElementById("caption").innerText =
images[currentIndex].caption;
}

</script>

</body>
</html>
